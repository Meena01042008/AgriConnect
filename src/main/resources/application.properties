
server.port=8080
spring.application.name=AgriConnect

spring.datasource.url=${AGRICONNECT_DB_URL:jdbc:mysql://localhost:3306/agriconnect?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${AGRICONNECT_DB_USER:root}
spring.datasource.password=${AGRICONNECT_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never

agriconnect.ai.api-key=${AGRICONNECT_AI_API_KEY:}
agriconnect.ai.base-url=${AGRICONNECT_AI_BASE_URL:https://api.openai.com/v1}
agriconnect.ai.model=${AGRICONNECT_AI_MODEL:gpt-4o-mini}

# Allow the UI to start even when MySQL is temporarily unavailable
spring.datasource.hikari.initialization-fail-timeout=-1

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

agriconnect.market.api-key=${AGRICONNECT_MARKET_API_KEY:}

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
agriconnect.ml.url=http://127.0.0.1:5001
